# Kanowa Backend Application Configuration
spring.application.name=kanowa-back
server.port=${PORT:8080}

# PostgreSQL Configuration (Supports local default and cloud environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanowa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Open In View
spring.jpa.open-in-view=false

# Logging
logging.level.com.kanowa=DEBUG
logging.level.org.springframework.web=INFO
